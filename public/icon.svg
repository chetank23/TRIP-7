  <text x="256" y="442" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#FFC49B" text-anchor="middle" letter-spacing="3">
